name: SonarCloud
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DOTNET_ROLL_FORWARD: Major   # permet au scanner de tourner sur le SDK preview du repo
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0           # historique complet, nécessaire pour Sonar
          submodules: recursive

      - uses: actions/setup-java@v5  # le scanner Sonar a besoin de Java 17+
        with:
          distribution: temurin
          java-version: '17'

      # Installé hors du repo : le NuGet.config d'aspnetcore n'inclut pas nuget.org
      - name: Installer le scanner
        working-directory: ${{ runner.temp }}
        run: dotnet tool install --global dotnet-sonarscanner --add-source https://api.nuget.org/v3/index.json

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Génère les assets JS Blazor (blazor.web.js…) requis par le build .NET
      - name: Build JS
        run: |
          npm ci
          npm run build

      - name: Restore (installe le SDK attendu par global.json dans .dotnet/)
        run: ./restore.sh

      - name: Utiliser le SDK local du repo
        run: |
          echo "$GITHUB_WORKSPACE/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$GITHUB_WORKSPACE/.dotnet" >> $GITHUB_ENV

      - name: Sonar begin
        run: >
          dotnet-sonarscanner begin
          /k:"EmilienHed_aspnetcore"
          /o:"emilienhed"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.exclusions="**/node_modules/**,**/dist/**,.dotnet/**,artifacts/**,**/test/**,**/tests/**,**/testassets/**,**/TestAssets/**,**/*.Tests/**,**/*Tests.cs,src/Testing/**"

      # Les analyseurs Sonar ajoutent des warnings : on ne les traite pas comme des erreurs
      - name: Build
        run: dotnet build src/Http/HttpAbstractions.slnf -c Release /p:TreatWarningsAsErrors=false

      - name: Sonar end
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
